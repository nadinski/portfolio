<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
      <link rel="icon" type="image/png" href="fav.png" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="HGK Engineering & Construction — Precision structural execution. From foundation to facade, we build the impossible."
    />
    <meta
      property="og:title"
      content="HGK Engineering & Construction | Build Beyond Limits"
    />
    <meta
      property="og:description"
      content="Precision structural execution. From foundation to facade, we build the impossible."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hgk-eng.com/" />
   <meta property="og:image" content="https://hgk-eng.com/night_new.webp" />
    <title>HGK Engineering & Construction | Build Beyond Limits</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f7f5f0;
        --solid: #1c1c1e;
        --gold: #c8a96e;
        --concrete: #e5e1d8;
        --transition: cubic-bezier(0.76, 0, 0.24, 1);
      }
      [data-theme="dark"] {
        --bg: #1c1c1e;
        --solid: #d4cfc7;
        --concrete: #2a2725;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--solid);
        font-family: "Space Mono", "Courier New", monospace;
        font-weight: 400;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        cursor: default;
        transition: background 0.5s var(--transition),
          color 0.5s var(--transition);
      }
      body.preloader-active {
        overflow: hidden;
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--gold);
        border-radius: 0;
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 0 6vw;
      }

      .hero-title,
      .stat-number,
      .founder-quote,
      .philosophy-large-text {
        font-family: "Space Mono", monospace;
        text-transform: uppercase;
        letter-spacing: -0.03em;
        line-height: 0.9;
      }
      .body-mono {
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #6b6b6e;
      }
      .section-label {
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.3em;
        color: var(--gold);
        text-transform: uppercase;
        margin-bottom: 2rem;
        text-align: left;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #1c1c1e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s var(--transition),
          visibility 0.6s var(--transition);
      }
      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-logo {
        font-family: "Space Mono", monospace;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 0.2em;
        margin-bottom: 1rem;
      }
      .preloader-line {
        width: 60px;
        height: 1px;
        background: var(--gold);
        animation: preloaderPulse 1.2s infinite;
      }
      @keyframes preloaderPulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scaleX(1);
        }
        50% {
          opacity: 1;
          transform: scaleX(1.8);
        }
      }

      .theme-toggle {
        position: relative;
        width: 44px;
        height: 22px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 11px;
        cursor: pointer;
        transition: background 0.3s var(--transition);
        flex-shrink: 0;
      }
      .theme-toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        background: var(--gold);
        border-radius: 50%;
        transition: transform 0.3s var(--transition);
      }
      [data-theme="dark"] .theme-toggle {
        background: rgba(255, 255, 255, 0.1);
      }
      [data-theme="dark"] .theme-toggle::after {
        transform: translateX(22px);
      }

      .lang-switch {
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .lang-switch .lang-active {
        color: var(--gold);
        font-weight: 700;
      }
      .lang-switch .lang-separator {
        opacity: 0.4;
        margin: 0 0.3rem;
      }
      .lang-switch .lang-inactive {
        opacity: 0.6;
        text-decoration: none;
      }
      .lang-switch .lang-inactive:hover {
        opacity: 1;
        color: var(--gold);
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 1.5rem 6vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
        background: transparent;
      }
      [data-theme="light"] nav {
        mix-blend-mode: difference;
        color: white;
      }
      [data-theme="dark"] nav {
        color: var(--solid);
      }
      .logo {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 1.2rem;
        letter-spacing: 0.1em;
      }
      [data-theme="light"] .logo {
        color: white;
      }
      [data-theme="dark"] .logo {
        color: var(--solid);
      }
      .nav-links {
        display: flex;
        gap: 3rem;
        list-style: none;
        align-items: center;
      }
      .nav-links a {
        text-decoration: none;
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        font-family: "Space Mono", monospace;
        transition: opacity 0.3s;
        position: relative;
        text-transform: uppercase;
      }
      [data-theme="light"] .nav-links a {
        color: white;
        opacity: 0.8;
      }
      [data-theme="dark"] .nav-links a {
        color: var(--solid);
        opacity: 0.8;
      }
      .nav-links a:hover,
      .nav-links a.active {
        opacity: 1;
      }
      .nav-links a.active::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 0;
        width: 100%;
        height: 1px;
        background: var(--gold);
      }

      .burger {
        display: none;
        flex-direction: column;
        gap: 5px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 101;
        padding: 5px;
      }
      .burger span {
        display: block;
        width: 25px;
        height: 2px;
        transition: all 0.3s var(--transition);
      }
      [data-theme="light"] .burger span {
        background: white;
        mix-blend-mode: difference;
      }
      [data-theme="dark"] .burger span {
        background: var(--solid);
      }
      .burger.active span:nth-child(1) {
        transform: rotate(45deg) translate(5px, 5px);
      }
      .burger.active span:nth-child(2) {
        opacity: 0;
      }
      .burger.active span:nth-child(3) {
        transform: rotate(-45deg) translate(5px, -5px);
      }

      .nav-overlay {
        position: fixed;
        inset: 0;
        z-index: 99;
        background: rgba(28, 28, 30, 0.45);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s var(--transition);
      }
      .nav-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .hero-section {
        height: 100vh;
        width: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #1c1c1e;
        overflow: hidden;
      }
      #three-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      .hero-content {
        position: relative;
        z-index: 10;
        text-align: center;
        color: #f7f5f0;
        pointer-events: none;
      }
      .hero-title {
        font-size: clamp(4rem, 15vw, 12rem);
        color: #f7f5f0;
        margin-bottom: 1rem;
        font-weight: 700;
      }
      .hero-subtitle {
        font-family: "Space Mono", monospace;
        font-size: clamp(0.6rem, 1.5vw, 0.8rem);
        letter-spacing: 0.5em;
        color: var(--gold);
        text-transform: uppercase;
      }
      .scroll-indicator {
        position: absolute;
        bottom: 3rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        color: #f7f5f0;
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        opacity: 0.6;
        animation: fadeMove 2s infinite;
      }
      @keyframes fadeMove {
        0% {
          opacity: 0.2;
          transform: translateX(-50%) translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) translateY(5px);
        }
        100% {
          opacity: 0.2;
          transform: translateX(-50%) translateY(0);
        }
      }

      .founder-section {
        background: var(--bg);
        padding: 12rem 0 8rem;
      }
      .founder-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4vw;
        align-items: center;
      }
      .texture-placeholder {
        width: 100%;
        padding-bottom: 140%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #9a9a9c;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background-color: var(--concrete);
        background-image: url("night_new.webp");
        background-size: cover;
        background-position: center;
      }
      .texture-placeholder::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><path d="M0 0h100v100H0z" fill="none"/><path d="M50 20L80 80H20L50 20z" stroke="%23C8A96E" stroke-width="0.5" fill="none"/><circle cx="50" cy="50" r="15" stroke="%231C1C1E" stroke-width="0.5" fill="none"/></svg>');
        background-size: cover;
        pointer-events: none;
      }
      .founder-quote {
        font-size: clamp(1.2rem, 2.5vw, 1.8rem);
        line-height: 1.2;
        margin-bottom: 2rem;
      }
      .founder-name {
        font-weight: 700;
        border-top: 1px solid var(--concrete);
        padding-top: 1.5rem;
        display: inline-block;
      }

      .stats-strip {
        background: #1c1c1e;
        color: #f7f5f0;
        padding: 5rem 6vw;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2rem;
      }
      [data-theme="dark"] .stats-strip {
        background: #2a2725;
        color: #d4cfc7;
      }
      .stat-item {
        text-align: center;
        padding: 0 1rem;
      }
      .stat-number {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 700;
        color: var(--gold);
        margin-bottom: 0.8rem;
        font-feature-settings: "tnum";
        letter-spacing: 0;
      }
      .stat-description {
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.8;
        line-height: 1.6;
      }

      .matrix-section {
        background: var(--bg);
        padding: 10rem 0;
        position: relative;
      }
      .matrix-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 2rem;
      }
      .matrix-item {
        background: var(--bg);
        padding: 2.5rem 2rem;
        transition: all 0.5s var(--transition);
        border: 1px solid transparent;
        cursor: default;
      }
      .matrix-item:nth-child(1) {
        grid-column: span 4;
      }
      .matrix-item:nth-child(2) {
        grid-column: span 4;
        margin-top: 3rem;
      }
      .matrix-item:nth-child(3) {
        grid-column: span 4;
        margin-top: 1rem;
      }
      .matrix-item:nth-child(4) {
        grid-column: span 5;
        margin-top: -2rem;
      }
      .matrix-item:nth-child(5) {
        grid-column: span 4;
        margin-top: 2rem;
      }
      .matrix-item:nth-child(6) {
        grid-column: span 3;
        margin-top: -1rem;
      }
      .matrix-item:hover {
        background: var(--solid);
        color: var(--bg);
        border-color: var(--gold);
        transform: translateY(-4px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        z-index: 2;
      }
      .matrix-icon-placeholder {
        width: 40px;
        height: 40px;
        border: 1px solid var(--solid);
        margin-bottom: 2rem;
        transition: all 0.5s var(--transition);
        position: relative;
      }
      .matrix-icon-placeholder::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        transform: translate(-50%, -50%);
        background: var(--solid);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        transition: background 0.5s var(--transition);
      }
      .matrix-item:hover .matrix-icon-placeholder {
        border-color: var(--gold);
        background: var(--gold);
      }
      .matrix-item:hover .matrix-icon-placeholder::after {
        background: var(--bg);
      }
      .matrix-item h3 {
        font-family: "Space Mono", monospace;
        font-size: 1rem;
        margin-bottom: 0.8rem;
        line-height: 1.3;
      }
      .matrix-item p {
        font-size: 0.7rem;
        line-height: 1.8;
        opacity: 0.7;
      }

      .projects-carousel-wrapper {
        position: relative;
        padding: 0 6vw;
        overflow: hidden;
      }
      .projects-carousel {
        display: flex;
        gap: 2vw;
        transition: transform 0.6s var(--transition);
        will-change: transform;
      }
      .project-card {
        flex: 0 0 auto;
        position: relative;
        height: 70vh;
      }
      .project-card img {
        height: 100%;
        width: auto;
        display: block;
        filter: grayscale(30%);
        transition: filter 0.6s var(--transition);
        pointer-events: none;
      }
      .project-card:hover img {
        filter: grayscale(0%);
      }
      .project-overlay {
        position: absolute;
        inset: 0;
        background: rgba(200, 169, 110, 0.92);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 2rem;
        opacity: 0;
        transition: opacity 0.4s var(--transition);
        color: #1c1c1e;
        pointer-events: none;
      }
      .project-card:hover .project-overlay {
        opacity: 1;
      }
      .project-overlay .project-name {
        font-family: "Space Mono", monospace;
        font-size: clamp(0.9rem, 1.5vw, 1.2rem);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin-bottom: 0.3rem;
      }
      .project-overlay .project-location {
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.15em;
        opacity: 0.8;
      }
      .project-overlay .project-scope {
        font-family: "Space Mono", monospace;
        font-size: 0.6rem;
        margin-top: 1rem;
        line-height: 1.6;
        opacity: 0.9;
        max-width: 320px;
      }
      .project-overlay .project-status {
        font-family: "Space Mono", monospace;
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        margin-top: 1.5rem;
        padding: 0.4rem 1rem;
        border: 1px solid #1c1c1e;
        display: inline-block;
        align-self: flex-start;
      }
      .carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(28, 28, 30, 0.7);
        border: 1px solid var(--gold);
        color: var(--gold);
        width: 48px;
        height: 48px;
        cursor: pointer;
        z-index: 5;
        font-family: "Space Mono", monospace;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s var(--transition);
        backdrop-filter: blur(10px);
      }
      .carousel-btn:hover {
        background: #1c1c1e;
        color: #f7f5f0;
        border-color: #f7f5f0;
      }
      .carousel-btn.prev {
        left: 6vw;
      }
      .carousel-btn.next {
        right: 6vw;
      }

      .image-band {
        height: 50vh;
        width: 100%;
        background: url("night_new2.webp") center/cover no-repeat;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .image-band::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          rgba(28, 28, 30, 0.7) 0%,
          rgba(28, 28, 30, 0.2) 50%,
          rgba(28, 28, 30, 0.7) 100%
        );
      }
      .image-band-quote {
        position: relative;
        z-index: 1;
        font-family: "Space Mono", monospace;
        font-size: clamp(1rem, 2.5vw, 1.8rem);
        color: #f7f5f0;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0 6vw;
      }

      .philosophy-section {
        padding: 8rem 0;
      }
      .philosophy-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6vw;
        align-items: start;
      }
      .philosophy-large-text {
        font-size: clamp(1.5rem, 3vw, 2.5rem);
        line-height: 1.1;
        font-weight: 700;
      }
      .philosophy-details {
        font-size: 0.8rem;
        line-height: 1.8;
        opacity: 0.7;
      }

      .contact-section {
        background: #1c1c1e;
        color: #f7f5f0;
        padding: 6rem 0;
      }
      [data-theme="dark"] .contact-section {
        background: #2a2725;
        color: #d4cfc7;
      }
      .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6vw;
        align-items: start;
      }
      .contact-info p {
        font-family: "Space Mono", monospace;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
        opacity: 0.9;
      }
      .contact-info a {
        color: var(--gold);
        text-decoration: none;
        font-size: 1rem;
        transition: opacity 0.3s;
      }
      .contact-info a:hover {
        opacity: 0.7;
      }
      .contact-messengers {
        display: flex;
        gap: 1.5rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      .contact-messengers a {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--gold);
        text-decoration: none;
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        padding: 0.6rem 1.2rem;
        border: 1px solid var(--gold);
        transition: all 0.3s var(--transition);
      }
      .contact-messengers a:hover {
        background: var(--gold);
        color: #1c1c1e;
      }
      [data-theme="dark"] .contact-messengers a:hover {
        color: #1c1c1e;
      }

      footer {
        border-top: 1px solid var(--concrete);
        padding: 3rem 6vw;
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        color: #6b6b6e;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .footer-nav {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
        margin-bottom: 2rem;
        justify-content: flex-start;
        width: 100%;
      }
      .footer-nav a {
        color: var(--solid);
        text-decoration: none;
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.15em;
        opacity: 0.6;
        transition: opacity 0.3s;
        text-transform: uppercase;
      }
      .footer-nav a:hover {
        opacity: 1;
      }

      .cookie-banner {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: #1c1c1e;
        color: #f7f5f0;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        gap: 2rem;
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.05em;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s var(--transition);
        max-width: 90vw;
      }
      .cookie-banner.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .cookie-btn {
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold);
        padding: 0.5rem 1.5rem;
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: all 0.3s var(--transition);
        white-space: nowrap;
      }
      .cookie-btn:hover {
        background: var(--gold);
        color: #1c1c1e;
      }

      .custom-cursor {
        position: fixed;
        width: 8px;
        height: 8px;
        background: var(--gold);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: difference;
        transition: transform 0.1s ease-out;
        display: none;
      }
      #projects .section-label,
#contacts .section-label,
.contact-section .section-label {
    margin-left: 0 !important;
    padding-left: 0 !important;
    text-align: left !important;
}

#projects .container,
.contact-section .container {
    padding-left: 6vw !important;
    padding-right: 6vw !important;
}

    <script>
      // The hero-only cut removed the sections the page scripts expect; guard the
      // lookups so a missing node can't throw and leave the preloader stuck.
      (function () {
        var byId = document.getElementById.bind(document);
        var stub = document.createElement('div');
        stub.classList.add('__stub');
        document.getElementById = function (id) { return byId(id) || stub; };
        var qs = document.querySelector.bind(document);
        document.querySelector = function (sel) { try { return qs(sel) || stub; } catch (e) { return stub; } };
        window.__errs = [];
        window.addEventListener('error', function (e) {
          window.__errs.push((e.message || 'err') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
          var p = byId('preloader');
          if (p) { p.classList.add('hidden'); document.body.classList.remove('preloader-active'); }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          window.__errs.push('reject: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const canvas = document.getElementById("three-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 5;
      const group = new THREE.Group();
      const materialWire = new THREE.MeshBasicMaterial({
        color: 0xc8a96e,
        wireframe: true,
        transparent: true,
        opacity: 0.4,
      });
      group.add(
        new THREE.Mesh(
          new THREE.CylinderGeometry(0.5, 0.5, 2.5, 6),
          materialWire
        )
      );
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.2, 0.02, 8, 40),
        new THREE.MeshBasicMaterial({
          color: 0xc8a96e,
          transparent: true,
          opacity: 0.5,
        })
      );
      ring.rotation.x = Math.PI / 2;
      group.add(ring);
      for (let i = 0; i < 4; i++) {
        const arm = new THREE.Mesh(
          new THREE.BoxGeometry(0.1, 1.8, 0.1),
          materialWire
        );
        arm.rotation.z = (i * Math.PI) / 4;
        group.add(arm);
      }
      scene.add(group);
      const particlesGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(150 * 3);
      for (let i = 0; i < 150 * 3; i++) posArray[i] = (Math.random() - 0.5) * 8;
      particlesGeo.setAttribute(
        "position",
        new THREE.BufferAttribute(posArray, 3)
      );
      scene.add(
        new THREE.Points(
          particlesGeo,
          new THREE.PointsMaterial({
            size: 0.02,
            color: 0xc8a96e,
            transparent: true,
            blending: THREE.AdditiveBlending,
          })
        )
      );
      let mouseX = 0,
        mouseY = 0;
      window.addEventListener("mousemove", (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      });
      function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.002;
        group.rotation.x = mouseY * 0.2;
        group.rotation.z = mouseX * 0.1;
        renderer.render(scene, camera);
      }
      animate();
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
    <script>
      window.addEventListener("load", () => {
        const p = document.getElementById("preloader");
        setTimeout(() => {
          p.classList.add("hidden");
          document.body.classList.remove("preloader-active");
        }, 1200);
      });
      const themeToggle = document.getElementById("themeToggle"),
        html = document.documentElement;
      html.setAttribute("data-theme", localStorage.getItem("theme") || "light");
      themeToggle.addEventListener("click", () => {
        const t = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", t);
        localStorage.setItem("theme", t);
      });
      function animateCounter(el) {
        const target = parseFloat(el.dataset.target),
          suffix = el.dataset.suffix || "",
          duration = 2000,
          start = performance.now();
        function upd(now) {
          const p = Math.min((now - start) / duration, 1),
            eased = 1 - Math.pow(1 - p, 3);
          const isFloat = target % 1 !== 0;
          el.textContent =
            (p < 1
              ? isFloat
                ? (target * eased).toFixed(1)
                : Math.floor(target * eased)
              : isFloat
              ? target.toFixed(1)
              : Math.floor(target)) + suffix;
          if (p < 1) requestAnimationFrame(upd);
        }
        requestAnimationFrame(upd);
      }
      const statsObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target
                .querySelectorAll(".counter")
                .forEach((c) => animateCounter(c));
              statsObserver.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.3 }
      );
      document
        .querySelectorAll(".stats-strip")
        .forEach((strip) => statsObserver.observe(strip));
      const burger = document.getElementById("burger"),
        navLinks = document.getElementById("navLinks"),
        navOverlay = document.getElementById("navOverlay");
      burger.addEventListener("click", () => {
        burger.classList.toggle("active");
        navLinks.classList.toggle("active");
        navOverlay.classList.toggle("active");
      });
      navLinks.querySelectorAll("a").forEach((l) =>
        l.addEventListener("click", () => {
          burger.classList.remove("active");
          navLinks.classList.remove("active");
          navOverlay.classList.remove("active");
        })
      );
      const sections = document.querySelectorAll("section[id]"),
        navItems = document.querySelectorAll(".nav-link");
      const navObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              navItems.forEach((link) => link.classList.remove("active"));
              const activeLink = document.querySelector(
                `.nav-link[href="#${entry.target.id}"]`
              );
              if (activeLink) activeLink.classList.add("active");
            }
          });
        },
        { threshold: 0.4, rootMargin: "-80px 0px 0px 0px" }
      );
      sections.forEach((s) => navObserver.observe(s));
      (function () {
        const c = document.getElementById("projectsCarousel"),
          pB = document.getElementById("carouselPrev"),
          nB = document.getElementById("carouselNext");
        if (!c || !pB || !nB) return;
        let idx = 0;
        const cards = c.querySelectorAll(".project-card");
        function amt(i) {
          if (i <= 0) return 0;
          let o = 0;
          const g = parseFloat(getComputedStyle(c).gap) || 0;
          for (let j = 0; j < i; j++) o += cards[j].offsetWidth + g;
          return o;
        }
        function upd() {
          c.style.transform = `translateX(-${amt(idx)}px)`;
          pB.style.opacity = idx === 0 ? "0" : "1";
          pB.style.pointerEvents = idx === 0 ? "none" : "auto";
          nB.style.opacity = idx >= cards.length - 1 ? "0" : "1";
          nB.style.pointerEvents = idx >= cards.length - 1 ? "none" : "auto";
        }
        nB.addEventListener("click", () => {
          if (idx < cards.length - 1) {
            idx++;
            upd();
          }
        });
        pB.addEventListener("click", () => {
          if (idx > 0) {
            idx--;
            upd();
          }
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight") {
            e.preventDefault();
            if (idx < cards.length - 1) {
              idx++;
              upd();
            }
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            if (idx > 0) {
              idx--;
              upd();
            }
          }
        });
        let ts = 0;
        c.addEventListener(
          "touchstart",
          (e) => {
            ts = e.changedTouches[0].screenX;
          },
          { passive: true }
        );
        c.addEventListener(
          "touchend",
          (e) => {
            const te = e.changedTouches[0].screenX;
            if (Math.abs(ts - te) > 50) {
              if (ts - te > 0 && idx < cards.length - 1) {
                idx++;
                upd();
              } else if (te - ts > 0 && idx > 0) {
                idx--;
                upd();
              }
            }
          },
          { passive: true }
        );
        upd();
      })();
      const cookieBanner = document.getElementById("cookieBanner"),
        cookieAccept = document.getElementById("cookieAccept");
      if (!localStorage.getItem("cookiesAccepted")) {
        setTimeout(() => cookieBanner.classList.add("visible"), 1500);
        cookieAccept.addEventListener("click", () => {
          localStorage.setItem("cookiesAccepted", "true");
          cookieBanner.classList.remove("visible");
        });
      }
      const cursor = document.getElementById("cursor");
      if (window.matchMedia("(pointer: fine)").matches) {
        cursor.style.display = "block";
        document.addEventListener("mousemove", (e) => {
          cursor.style.transform = `translate(${e.clientX - 4}px, ${
            e.clientY - 4
          }px)`;
        });
        document
          .querySelectorAll(".project-card, .matrix-item")
          .forEach((el) => {
            el.addEventListener("mouseenter", () => {
              cursor.style.transform =
                cursor.style.transform.replace("translate", "translate") +
                " scale(3)";
              cursor.style.background = "white";
            });
            el.addEventListener("mouseleave", () => {
              cursor.style.transform = "scale(1)";
              cursor.style.background = "#C8A96E";
            });
          });
      } else {
        cursor.style.display = "none";
      }
    </script>
  
    <script>
      // No /TR page exists, so the switch translates the hero in place.

        var en = document.getElementById('langEn');

        var copy = { en: 'The Art of Structural Integrity', tr: 'Yapısal Bütünlüğün Sanatı' };

          document.documentElement.lang = lang;

        tr.addEventListener('click', function () { set('tr'); });
      })();
