    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Forum&family=Great+Vibes&display=block" />

    <style>
      :root {
        --bg: #f5f3f0;
        --card-bg: #ffffff;
        --gold: #c4a44a;
        --gold-dark: #a8892e;
        --text: #1a1a1a;
        --text-soft: #4a4540;
        --text-muted: #7a7570;
        --border: #e8e2d8;
        --border-gold: rgba(196, 164, 74, 0.3);
        --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.05);
        --font-title: "Great Vibes", cursive;
        --font-text: "Forum", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      ::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(
          to bottom,
          rgba(196, 164, 74, 0.3),
          rgba(196, 164, 74, 0.6),
          rgba(196, 164, 74, 0.3)
        );
        border-radius: 1.5px;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(196, 164, 74, 0.5) transparent;
      }

      .app-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        background: var(--bg);
        font-family: var(--font-text);
        color: var(--text);
      }

      /* ГЛАВНЫЙ ЭКРАН */
      .hero-section {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* Оверлей стал прозрачнее, чтобы водопад был виден */
      .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0.3) 60%,
          rgba(255, 255, 255, 0.4) 10%
        );
      }

      .hero-content {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 520px;
        padding: 40px 16px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Настоящий логотип */
      .logo-img {
        width: 180px;
        height: auto;
        margin-bottom: 16px;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.1));
      }
      .hero-title {
        font-family: var(--font-title);
        font-size: 2.8rem;
        font-weight: 400;
        color: var(--text);
        letter-spacing: 1px;
        text-align: center;
        line-height: 1.2;
        margin-bottom: 4px;
      }
      .hero-subtitle {
        font-family: var(--font-text);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        color: var(--text-muted);
        margin-bottom: 32px;
      }

      .combo-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }
      .combo-card {
        background: var(--card-bg);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: all 0.35s ease;
        display: flex;
        flex-direction: column;
      }
      .combo-card:active {
        transform: scale(0.985);
      }
      .combo-photo {
        width: 100%;
        height: 180px;
        background-size: cover;
        background-position: center;
        position: relative;
      }
      .combo-number {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(6px);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-title);
        font-size: 1.4rem;
        color: var(--gold-dark);
        border: 1px solid rgba(196, 164, 74, 0.4);
      }
      .combo-body {
        padding: 18px 16px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .combo-body h3 {
        font-family: var(--font-title);
        font-size: 1.6rem;
        font-weight: 400;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
        color: var(--text);
      }
      .combo-features {
        list-style: none;
        font-family: var(--font-text);
        font-size: 0.9rem;
        color: var(--text-soft);
        line-height: 1.7;
        margin-bottom: 14px;
        flex: 1;
      }
      .combo-features li::before {
        content: "— ";
        color: var(--gold);
      }
      .combo-price {
        font-family: var(--font-text);
        font-size: 1.3rem;
        font-weight: 400;
        color: var(--gold-dark);
        letter-spacing: 0.5px;
      }

      /* ЗНАЧОК ХАЛЯЛЬ */
      .halal-sticker {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
        animation: float 3s ease-in-out infinite;
        transition: all 0.3s ease;
      }
      .halal-sticker:hover {
        transform: scale(1.1);
        filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
      }
      .halal-sticker img {
        width: 65px;
        height: auto;
        opacity: 0.95;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      /* ДЕТАЛЬНЫЙ ЭКРАН */
      .detail-screen {
        display: none;
        background: var(--bg);
        min-height: 100vh;
      }
      .detail-screen.active {
        display: block;
      }
      .detail-container {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 16px 60px;
        background: var(--card-bg);
        min-height: 100vh;
      }
      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .detail-screen.active .detail-container {
        animation: fadeSlideIn 0.3s ease;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-text);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--gold-dark);
        cursor: pointer;
        padding: 8px 0;
        margin-bottom: 20px;
        background: none;
        border: none;
        -webkit-tap-highlight-color: transparent;
      }
      .back-btn:active {
        opacity: 0.6;
      }
      .back-arrow {
        font-size: 1.2rem;
      }

      .detail-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .detail-header h2 {
        font-family: var(--font-title);
        font-size: 2.2rem;
        font-weight: 400;
        letter-spacing: 1px;
      }
      .detail-price-badge {
        display: inline-block;
        margin-top: 8px;
        font-family: var(--font-text);
        font-size: 1.2rem;
        color: var(--gold-dark);
        border: 1px solid var(--border-gold);
        padding: 6px 20px;
        border-radius: 30px;
      }

      .detail-section {
        margin-bottom: 28px;
      }
      .detail-section h3 {
        font-family: var(--font-title);
        font-size: 1.6rem;
        font-weight: 400;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }
      .detail-item {
        background: #fcfbf9;
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .detail-item-img {
        width: 70px;
        height: 70px;
        border-radius: 10px;
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
        background-color: #f0ede8;
      }
      .detail-item-content {
        flex: 1;
      }
      .detail-item-name {
        font-family: var(--font-text);
        font-size: 1rem;
        color: var(--text);
        margin-bottom: 4px;
      }
      .detail-item-comp {
        font-family: var(--font-text);
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .detail-item.note {
        background: transparent;
        border: none;
        padding: 6px 0;
        display: block;
        font-style: italic;
        color: var(--text-muted);
      }
      .detail-photo {
        width: 100%;
        height: 160px;
        border-radius: 14px;
        background-size: cover;
        background-position: center;
        margin-bottom: 10px;
      }
      .detail-photo-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 12px;
      }
      .detail-photo-grid .detail-photo {
        height: 130px;
        margin-bottom: 0;
      }

      @media (min-width: 600px) {
        .combo-grid {
          grid-template-columns: 1fr 1fr;
          gap: 20px;
        }
      }
      /* Вставить в <style> после существующих правил для .logo-img и .halal-sticker img */

        filter: grayscale(100%) brightness(0.35) contrast(1.1);

      }

        filter: grayscale(100%) brightness(0.35) contrast(1.1);

        function renderMainScreen() {
          comboGrid.innerHTML = "";
          combos.forEach((combo) => {
            const card = document.createElement("div");
            card.className = "combo-card";
            card.innerHTML = `
                <div class="combo-photo" style="background-image: url('${
                  combo.photo
                }')">
                    <div class="combo-number">${combo.id}</div>
                </div>
                <div class="combo-body">
                    <h3>${combo.title}</h3>
                    <ul class="combo-features">${combo.features
                      .map((f) => `<li>${f}</li>`)
                      .join("")}</ul>
                    <div class="combo-price">${combo.price}</div>
                </div>
            `;
            card.addEventListener("click", () => openDetail(combo));
            comboGrid.appendChild(card);
          });
        }

        function openDetail(combo) {
          let html = `
            <button class="back-btn" id="backBtn"><span class="back-arrow">←</span> Back to menus</button>
            <div class="detail-header"><h2>${combo.title}</h2><div class="detail-price-badge">${combo.price}</div></div>
        `;
          combo.sections.forEach((section) => {
            html += `<div class="detail-section"><h3>${section.title}</h3>`;
            if (section.photoGrid) {
              html += '<div class="detail-photo-grid">';
              section.items.forEach(
                (item) =>
                  (html += `<div class="detail-photo" style="background-image: url('${
                    item.photo || placeholder
                  }')"></div>`)
              );
              html += "</div>";
            }
            section.items.forEach((item) => {
              if (item.note) {
                html += `<div class="detail-item note">${item.name} — ${item.comp}</div>`;
              } else {
                html += `
                        <div class="detail-item">
                            <div class="detail-item-img" style="background-image: url('${
                              item.photo || placeholder
                            }')"></div>
                            <div class="detail-item-content">
                                <div class="detail-item-name">${item.name}</div>
                                ${
                                  item.comp
                                    ? `<div class="detail-item-comp">${item.comp}</div>`
                                    : ""
                                }
                            </div>
                        </div>
                    `;
              }
            });
            html += "</div>";
          });
          detailContainer.innerHTML = html;
          detailScreen.classList.add("active");
          mainScreen.style.display = "none";
          wrapper.scrollTo({ top: 0, behavior: "instant" });
          document
            .getElementById("backBtn")
            .addEventListener("click", closeDetail);
        }

        function closeDetail() {
          detailScreen.classList.remove("active");
          detailContainer.innerHTML = "";
          mainScreen.style.display = "flex";
          wrapper.scrollTo({ top: 0, behavior: "instant" });
        }

        renderMainScreen();
      })();
